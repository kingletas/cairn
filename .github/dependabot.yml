version: 2
updates:
  # Grouped, and few. One pull request per package meant twelve of them open at once,
  # each running its own CI.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      npm: { patterns: ['*'] }
    # Each of these follows something else, and tests/unit/toolchain.test.js fails the
    # day the hold should move.
    ignore:
      # The Node types follow the Node inside Electron, not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript stops where typescript-eslint's supported range stops.
      - dependency-name: typescript
        versions: ['>=6.1']

  - package-ecosystem: cargo
    directory: /crates/cairn-keyring
    schedule: { interval: weekly }
    open-pull-requests-limit: 1
    groups:
      cargo: { patterns: ['*'] }

  # A pinned action is only safe while somebody is watching it age.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 1
    groups:
      actions: { patterns: ['*'] }
